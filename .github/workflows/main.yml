name: Damage Calculation Test

on:
  push:
    branches: [ main-2023 ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      uses: actions/checkout@V3
      name: Use Node.js V18.15.0
      uses: actions/setup-node@V3
      with:
        node-version: '18.15.0'
     
      run: yarn install
      run: yarn test
